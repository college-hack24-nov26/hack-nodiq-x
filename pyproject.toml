[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nodiq"
version = "0.1.0"
description = "NODIQ-X Metallurgical Inspection & Analysis Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "flask-cors>=6.0.0",
    "fpdf2>=2.8",
    "numpy==2.4.6",
    "opencv-python==5.0.0.93",
    "reportlab>=4.0",
    "requests==2.34.2",
    "bcrypt>=4.0",
    "psycopg2-binary>=2.9",
    "PyWavelets>=1.5",
    "scipy>=1.11.0",
    "scikit-image>=0.20.0",
    "matplotlib>=3.7.0",
    "qrcode[pil]>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "node_modules",
    "archive",
    "third_party",
    ".venv*",
    "data",
    "outputs",
    "logs",
]

