<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Typography system (two-tier): Inter is the primary UI font for all
         product text (weights 400-700); IBM Plex Mono is the technical layer
         for genuinely technical data — IDs, measurements, readouts (400-600).
         Loaded once here; components read --font-ui/--font-tech via the
         --font-body/--font-mono aliases. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap"
      rel="stylesheet"
    />
    <title>NODIQ-X — AI-Powered Microstructure Intelligence</title>
  </head>
  <body>
    <script>
      // No-flash theme init: apply the persisted (or OS-preferred) theme
      // before any paint. ThemeContext takes over after React mounts.
      (function () {
        try {
          var t = localStorage.getItem('nodiq-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
